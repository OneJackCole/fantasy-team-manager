name: Daily fantasy email

on:
  schedule:
    # GitHub can delay or drop scheduled runs (most often on the hour), so try several times
    # at off-peak minutes. The gate sends from the first run at or after 8 AM Eastern and
    # skips the rest once one has sent. In UTC: 8:07 AM Eastern is 12:07 in daylight time,
    # 13:07 in standard time; the later runs are fallbacks.
    - cron: '7 12 * * *'
    - cron: '7 13 * * *'
    - cron: '37 13 * * *'
    - cron: '7 14 * * *'
  workflow_dispatch:  # "Run workflow" button for a test send

permissions:
  contents: read
  actions: read  # the gate checks whether an earlier run already sent today's email

# One run at a time, so a delayed run can't send alongside a later one
concurrency:
  group: daily-email
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Decide whether to send
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/email_gate.py

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.send == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.gate.outputs.send == 'true'
        run: pip install requests

      # For the Claude briefing; runs on the Claude subscription via CLAUDE_CODE_OAUTH_TOKEN
      - name: Install Claude Code
        if: steps.gate.outputs.send == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Send email
        if: steps.gate.outputs.send == 'true'
        env:
          TZ: America/New_York
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Live rosters; without these the league files' rosters are used
          YAHOO_CONSUMER_KEY: ${{ secrets.YAHOO_CONSUMER_KEY }}
          YAHOO_CONSUMER_SECRET: ${{ secrets.YAHOO_CONSUMER_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: |
          args=""
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            args="--briefing"
          else
            echo "CLAUDE_CODE_OAUTH_TOKEN is not set - sending without the briefing"
          fi
          python daily_email.py $args

