name: Daily fantasy email

on:
  schedule:
    # 8 AM Eastern is 12:00 UTC in daylight time and 13:00 UTC in standard time.
    # Both run; the gate below lets through only the one that is 8 AM in New York today.
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:  # "Run workflow" button for a test send

permissions:
  contents: write  # commit the projection tracking files

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check it's the 8 AM Eastern run
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$SCHEDULE" ]; then echo "send=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          hour=$(echo "$SCHEDULE" | cut -d' ' -f2)
          ny_hour=$(TZ=America/New_York date -d "$(date -u +%F) ${hour}:00 UTC" +%-H)
          echo "Cron hour ${hour} UTC is ${ny_hour}:00 in New York"
          if [ "$ny_hour" = "8" ]; then echo "send=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.send == 'true'

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.send == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.gate.outputs.send == 'true'
        run: pip install requests

      # For the Claude briefing; runs on the Claude subscription via CLAUDE_CODE_OAUTH_TOKEN
      - name: Install Claude Code
        if: steps.gate.outputs.send == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Send email
        if: steps.gate.outputs.send == 'true'
        env:
          TZ: America/New_York
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          args="--track"
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            args="$args --briefing"
          else
            echo "CLAUDE_CODE_OAUTH_TOKEN is not set - sending without the briefing"
          fi
          python daily_email.py $args

      - name: Save projection tracking
        if: steps.gate.outputs.send == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracking
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "Track projections $(TZ=America/New_York date +%F)"
          git pull --rebase
          git push
